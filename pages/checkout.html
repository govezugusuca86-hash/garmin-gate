<!-- ===== SVG SPRITES ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script src="../js/site.js"></script>
<script>
(function () {
  'use strict';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function svg(id, cls) {
    return '<svg class="' + (cls || 'icon-inline') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }

  // ===== Маска телефона: +7 (___) ___-__-__  =====
  function formatPhone(raw) {
    var digits = String(raw).replace(/\D/g, '');
    if (!digits) return '';
    // нормализуем 8 -> 7
    if (digits[0] === '8') digits = '7' + digits.slice(1);
    if (digits[0] !== '7') digits = '7' + digits;
    digits = digits.slice(0, 11);

    var d = digits;
    var out = '+7';
    if (d.length > 1) out += ' (' + d.slice(1, 4);
    if (d.length >= 4) out += ') ' + d.slice(4, 7);
    if (d.length >= 7) out += '-' + d.slice(7, 9);
    if (d.length >= 9) out += '-' + d.slice(9, 11);
    return out;
  }

  function bindPhoneMask(input) {
    function onInput() {
      var pos = input.selectionStart || input.value.length;
      var before = input.value.slice(0, pos).replace(/\D/g, '').length;
      input.value = formatPhone(input.value);
      // ставим курсор после последней набранной цифры
      var formatted = input.value;
      var count = 0, i = 0;
      while (i < formatted.length && count < before) {
        if (/\d/.test(formatted[i])) count++;
        i++;
      }
      try { input.setSelectionRange(i, i); } catch (e) {}
    }
    input.addEventListener('input', onInput);
    input.addEventListener('focus', function () {
      if (!input.value) input.value = '+7 ';
    });
  }

  function isValidPhone(s) {
    var d = String(s).replace(/\D/g, '');
    return d.length === 11 && (d[0] === '7' || d[0] === '8');
  }
  function isValidEmail(s) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  }

  // ===== Рендер =====
  function renderEmpty() {
    document.getElementById('checkoutContent').innerHTML =
      '<div class="cart-empty">' +
        '<h2>Корзина пуста</h2>' +
        '<p>Сначала добавьте товары из каталога</p>' +
        '<a href="../index.html" class="btn-primary" style="display:inline-flex;">Перейти в каталог</a>' +
      '</div>';
  }

  function render() {
    var summary = Cart.getOrderSummary();
    if (!summary.items.length) { renderEmpty(); return; }

    var itemsHtml = summary.items.map(function (it) {
      var label = (it.brand ? it.brand + ' ' : '') + it.name + ' × ' + it.qty;
      return '<div class="summary-item">' +
               '<span class="summary-item-name">' + escapeHtml(label) + '</span>' +
               '<span class="summary-item-price">' + formatPrice(it.price * it.qty) + '</span>' +
             '</div>';
    }).join('');

    var totalQty = summary.items.reduce(function (s, i) { return s + i.qty; }, 0);

    document.getElementById('checkoutContent').innerHTML =
      '<div class="checkout-layout">' +
        '<div class="checkout-form">' +
          '<h2>Контактные данные</h2>' +
          '<div id="formError" class="form-error">' + svg('i-alert') + '<span id="formErrorText"></span></div>' +

          '<form id="orderForm" novalidate autocomplete="on">' +

            // Honeypot — невидимое поле для ботов
            '<div class="hp-field" aria-hidden="true">' +
              '<label>Сайт (не заполняйте)<input type="text" name="website" tabindex="-1" autocomplete="off"></label>' +
            '</div>' +

            // ФИ
            '<div class="form-group">' +
              '<label for="fullName">Имя и фамилия<span class="req">*</span></label>' +
              '<div class="input-with-icon">' +
                svg('i-user', 'input-icon') +
                '<input class="form-input" type="text" id="fullName" name="fullName" autocomplete="name" required maxlength="80">' +
              '</div>' +
              '<div class="field-error" data-for="fullName">Укажите имя и фамилию</div>' +
            '</div>' +

            // Телефон + Email
            '<div class="form-row">' +
              '<div class="form-group">' +
                '<label for="phone">Телефон<span class="req">*</span></label>' +
                '<div class="input-with-icon">' +
                  svg('i-phone', 'input-icon') +
                  '<input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+7 (___) ___-__-__" inputmode="tel" required>' +
                '</div>' +
                '<div class="field-error" data-for="phone">Введите корректный российский номер</div>' +
              '</div>' +
              '<div class="form-group">' +
                '<label for="email">Email</label>' +
                '<div class="input-with-icon">' +
                  svg('i-mail', 'input-icon') +
                  '<input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" inputmode="email">' +
                '</div>' +
                '<div class="field-error" data-for="email">Введите корректный email</div>' +
              '</div>' +
            '</div>' +
            '<p class="form-hint">Менеджер свяжется с вами по телефону в течение часа в рабочее время.</p>' +

            // Доставка
            '<label class="delivery-toggle">' +
              '<input type="checkbox" id="needDelivery" name="needDelivery">' +
              '<span class="checkbox-box">' + svg('i-check') + '</span>' +
              '<span class="delivery-toggle-label">' +
                '<span class="delivery-toggle-title">Нужна доставка</span>' +
                '<span class="delivery-toggle-sub" id="deliveryToggleSub">По умолчанию — самовывоз из ТЦ Талисман, Саранск</span>' +
              '</span>' +
            '</label>' +

            '<div class="delivery-block" id="deliveryBlock">' +
              '<div class="delivery-methods">' +
                '<label class="delivery-method">' +
                  '<input type="radio" name="deliveryMethod" value="СДЭК" checked>' +
                  '<span class="radio-dot"></span>' +
                  svg('i-truck', 'delivery-method-icon') +
                  '<span class="delivery-method-name">СДЭК</span>' +
                '</label>' +
                '<label class="delivery-method">' +
                  '<input type="radio" name="deliveryMethod" value="Яндекс Доставка">' +
                  '<span class="radio-dot"></span>' +
                  svg('i-truck', 'delivery-method-icon') +
                  '<span class="delivery-method-name">Яндекс Доставка</span>' +
                '</label>' +
              '</div>' +
              '<div class="form-group">' +
                '<label for="deliveryCity">Город<span class="req">*</span></label>' +
                '<div class="input-with-icon">' +
                  svg('i-pin', 'input-icon') +
                  '<input class="form-input" type="text" id="deliveryCity" name="deliveryCity" autocomplete="address-level2" maxlength="80">' +
                '</div>' +
                '<div class="field-error" data-for="deliveryCity">Укажите город</div>' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="deliveryAddress">Адрес (улица, дом, квартира)<span class="req">*</span></label>' +
                '<div class="input-with-icon">' +
                  svg('i-pin', 'input-icon') +
                  '<input class="form-input" type="text" id="deliveryAddress" name="deliveryAddress" autocomplete="street-address" maxlength="200">' +
                '</div>' +
                '<div class="field-error" data-for="deliveryAddress">Укажите адрес доставки</div>' +
              '</div>' +
            '</div>' +

            // Комментарий
            '<div class="form-group" style="margin-top:18px;">' +
              '<label for="comment">Комментарий к заказу</label>' +
              '<div class="input-with-icon">' +
                svg('i-msg', 'input-icon') +
                '<input class="form-input" type="text" id="comment" name="comment" placeholder="Необязательно" maxlength="400">' +
              '</div>' +
            '</div>' +

            // Submit
            '<button type="submit" id="submitBtn" class="btn-submit">' +
              svg('i-lock') + '<span id="submitBtnText">Оформить заказ</span>' +
            '</button>' +

            '<a href="cart.html" class="back-to-cart">' + svg('i-arrow-left') + 'Вернуться в корзину</a>' +
          '</form>' +
        '</div>' +

        '<div class="order-summary">' +
          '<h3>Ваш заказ</h3>' +
          '<div class="summary-items">' + itemsHtml + '</div>' +
          '<div class="summary-row"><span>Товаров:</span><span>' + totalQty + ' шт.</span></div>' +
          '<div class="summary-row summary-total"><span>Сумма:</span><span>' + formatPrice(summary.total) + '</span></div>' +
        '</div>' +
      '</div>';

    // ===== Привязки =====
    var phoneEl = document.getElementById('phone');
    bindPhoneMask(phoneEl);

    var toggle = document.getElementById('needDelivery');
    var block  = document.getElementById('deliveryBlock');
    var sub    = document.getElementById('deliveryToggleSub');
    toggle.addEventListener('change', function () {
      if (toggle.checked) {
        block.classList.add('is-open');
        sub.textContent = 'Заполните адрес ниже';
      } else {
        block.classList.remove('is-open');
        sub.textContent = 'По умолчанию — самовывоз из ТЦ Талисман, Саранск';
      }
    });

    // Снимаем флаг ошибки при изменении поля
    document.querySelectorAll('.form-input').forEach(function (inp) {
      inp.addEventListener('input', function () {
        inp.classList.remove('is-invalid');
        var err = document.querySelector('.field-error[data-for="' + inp.id + '"]');
        if (err) err.classList.remove('is-visible');
      });
    });

    document.getElementById('orderForm').addEventListener('submit', onSubmit);
  }

  // ===== Submit =====
  function showFieldError(id, msg) {
    var inp = document.getElementById(id);
    var err = document.querySelector('.field-error[data-for="' + id + '"]');
    if (inp) inp.classList.add('is-invalid');
    if (err) {
      if (msg) err.textContent = msg;
      err.classList.add('is-visible');
    }
  }
  function clearAllErrors() {
    document.querySelectorAll('.form-input.is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
    document.querySelectorAll('.field-error.is-visible').forEach(function (el) { el.classList.remove('is-visible'); });
    var box = document.getElementById('formError');
    if (box) box.classList.remove('is-visible');
  }
  function showFormError(msg) {
    var box = document.getElementById('formError');
    document.getElementById('formErrorText').textContent = msg;
    box.classList.add('is-visible');
  }

  // Лок повторной отправки (10 секунд)
  function recentlySubmitted() {
    try {
      var ts = Number(sessionStorage.getItem('gg_last_submit_ts') || '0');
      return ts && (Date.now() - ts) < 10000;
    } catch (e) { return false; }
  }

  function onSubmit(e) {
    e.preventDefault();
    clearAllErrors();

    var fullName = document.getElementById('fullName').value.trim();
    var phone    = document.getElementById('phone').value.trim();
    var email    = document.getElementById('email').value.trim();
    var comment  = document.getElementById('comment').value.trim();
    var needDelivery = document.getElementById('needDelivery').checked;
    var deliveryMethod = '', deliveryCity = '', deliveryAddress = '';

    var hasErrors = false;
    if (!fullName) { showFieldError('fullName'); hasErrors = true; }
    if (!isValidPhone(phone)) { showFieldError('phone'); hasErrors = true; }
    if (email && !isValidEmail(email)) { showFieldError('email'); hasErrors = true; }

    if (needDelivery) {
      var checkedRadio = document.querySelector('input[name="deliveryMethod"]:checked');
      deliveryMethod = checkedRadio ? checkedRadio.value : '';
      deliveryCity   = document.getElementById('deliveryCity').value.trim();
      deliveryAddress= document.getElementById('deliveryAddress').value.trim();
      if (!deliveryCity)    { showFieldError('deliveryCity'); hasErrors = true; }
      if (!deliveryAddress) { showFieldError('deliveryAddress'); hasErrors = true; }
    }

    if (hasErrors) {
      showFormError('Проверьте отмеченные поля.');
      return;
    }

    var summary = Cart.getOrderSummary();
    if (!summary.items.length) { showFormError('Корзина пуста.'); return; }

    if (recentlySubmitted()) {
      showFormError('Заказ уже отправляется. Подождите несколько секунд.');
      return;
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('submitBtnText').textContent = 'Отправляем…';

    var payload = {
      fullName: fullName,
      phone:    phone,
      email:    email,
      delivery: {
        needed:  needDelivery,
        method:  deliveryMethod,
        city:    deliveryCity,
        address: deliveryAddress
      },
      comment:  comment,
      items:    summary.items,
      total:    summary.total,
      website:  document.querySelector('input[name="website"]').value, // honeypot
      userAgent: navigator.userAgent,
      referer:   document.referrer || ''
    };

    try { sessionStorage.setItem('gg_last_submit_ts', String(Date.now())); } catch (e) {}

    Cart.submitOrder(payload).then(function (result) {
      try { if (window.ym) ym(108563480, 'reachGoal', 'order_submit'); } catch (e) {}

      try {
        sessionStorage.setItem('gg_last_order', JSON.stringify({
          orderNumber: result.orderNumber,
          isPending:   !!result.isPending,
          fullName:    fullName,
          phone:       phone,
          email:       email,
          delivery:    payload.delivery,
          comment:     comment,
          items:       summary.items,
          total:       summary.total,
          createdAt:   Date.now()
        }));
      } catch (e) {}

      try { Cart.clear(); } catch (e) {}
      location.href = 'success.html';
    }).catch(function (err) {
      btn.disabled = false;
      document.getElementById('submitBtnText').textContent = 'Оформить заказ';
      showFormError('Не удалось оформить заказ. Попробуйте ещё раз.');
      console.error(err);
    });
  }

  document.addEventListener('DOMContentLoaded', render);
})();
</script>
