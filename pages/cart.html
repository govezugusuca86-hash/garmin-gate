<body data-page="cart">
<div data-mount="header"></div>
<main class="cart-page container">
  <div class="breadcrumb">
    <a href="../index.html">Главная</a><span class="sep">›</span><span>Корзина</span>
  </div>
  <h1 style="font-size:32px;margin-bottom:32px;">Корзина</h1>
  <div id="cartContent"></div>
</main>
<div data-mount="footer"></div>
<script src="../js/app.js"></script>
<script src="../js/site.js"></script>
<script>
function renderCart() {
  var cart = Cart.get();
  var el = document.getElementById('cartContent');
  if (cart.length === 0) {
    el.innerHTML = '<div class="cart-empty"><div style="font-size:64px;margin-bottom:16px;">🛒</div><h2>Корзина пуста</h2><p>Добавьте товары из каталога</p><a href="../index.html" class="btn-primary" style="display:inline-flex;">Перейти в каталог</a></div>';
    return;
  }
  var total = Cart.total();
  var oldTotal = cart.reduce(function(s,i){
    var p = PRODUCTS_DATA.products.find(function(x){return x.id===i.id;});
    return s+((p&&p.oldprice?p.oldprice:(p?p.price:i.price))*i.qty);
  },0);
  var savings = oldTotal - total;
  var totalQty = cart.reduce(function(s,i){return s+i.qty;},0);
  var summaryHtml = '<div class="cart-summary">';
  summaryHtml += '<h3>Итого</h3>';
  summaryHtml += '<div class="summary-row"><span>Товаров:</span><span>'+totalQty+' шт.</span></div>';
  if (savings>0) summaryHtml += '<div class="summary-row" style="color:#f02424;"><span>Экономия:</span><span>-'+formatPrice(savings)+'</span></div>';
  summaryHtml += '<div class="summary-row summary-total"><span>Сумма:</span><span>'+formatPrice(total)+'</span></div>';
  summaryHtml += '<a href="https://vk.me/neogar_shop" target="_blank" class="btn-vk" onclick="ym(108563480,\'reachGoal\',\'order_vk\')">';
  summaryHtml += '<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14C20.67 22 22 20.67 22 15.07V8.93C22 3.33 20.67 2 15.07 2zm2.18 13.17h-1.49c-.56 0-.73-.44-1.74-1.46-.87-.85-1.26-.97-1.47-.97-.3 0-.38.08-.38.49v1.33c0 .35-.11.56-1.03.56-1.52 0-3.2-.92-4.38-2.64C5.1 10.35 4.7 8.74 4.7 8.38c0-.21.08-.4.49-.4h1.49c.37 0 .5.17.64.56.71 2.03 1.89 3.81 2.38 3.81.18 0 .26-.08.26-.54V9.63c-.06-1-.57-1.08-.57-1.44 0-.17.14-.35.37-.35h2.35c.31 0 .42.17.42.53v2.89c0 .31.14.42.22.42.18 0 .34-.11.68-.45 1.05-1.18 1.8-2.99 1.8-2.99.1-.21.27-.4.64-.4h1.49c.45 0 .55.23.45.54-.19.87-2.02 3.46-2.02 3.46-.16.26-.22.38 0 .67.16.21.69.67 1.04 1.08.65.74 1.14 1.36 1.27 1.79.12.42-.09.64-.51.64z"/></svg>';
  summaryHtml += 'Оформить заказ в VK</a></div>';
  el.innerHTML = '<div class="cart-layout"><div><div id="cartItems"></div><div style="margin-top:16px;"><button onclick="Cart.clear();renderCart();" style="font-family:var(--font);font-size:12px;color:#969696;cursor:pointer;border:none;background:none;text-decoration:underline;">Очистить корзину</button></div></div>'+summaryHtml+'</div>';
  document.getElementById('cartItems').innerHTML = cart.map(function(item){
    var p = PRODUCTS_DATA.products.find(function(x){return x.id===item.id;});
    var pic = (p&&p.picture)?p.picture:item.picture;
    return '<div class="cart-item"><img class="cart-item-img" src="'+pic+'" alt="'+item.name+'" onerror="this.style.display=\'none\'"><div><div class="cart-item-brand">'+item.brand+'</div><div class="cart-item-name"><a href="product.html?id='+item.id+'" style="color:inherit;">'+item.name+'</a></div><div style="margin-top:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(\''+item.id+'\',-1)">-</button><span class="qty-val">'+item.qty+'</span><button class="qty-btn" onclick="changeQty(\''+item.id+'\',1)">+</button></div><div class="cart-item-price">'+formatPrice(item.price*item.qty)+'</div><button class="cart-item-remove" onclick="removeItem(\''+item.id+'\')" title="Удалить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div></div></div>';
  }).join('');
}
function changeQty(id,delta){
  var cart=Cart.get();
  var idx=-1;
  for(var i=0;i<cart.length;i++){if(cart[i].id===id){idx=i;break;}}
  if(idx>=0){cart[idx].qty=Math.max(1,cart[idx].qty+delta);Cart.save(cart);renderCart();}
}
function removeItem(id){Cart.remove(id);renderCart();}
document.addEventListener('DOMContentLoaded',renderCart);
</script>
</body>
</html>
