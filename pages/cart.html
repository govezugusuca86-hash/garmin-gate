<body data-page="cart">
<div data-mount="header"></div>
<main class="cart-page container">
  <div class="breadcrumb">
    <a href="../index.html">Главная</a><span class="sep">›</span><span>Корзина</span>
  </div>
  <h1 style="font-size:32px;margin-bottom:32px;">Корзина</h1>
  <div id="cartContent"></div>
</main>
<div data-mount="footer"></div>
<script src="../js/products.js"></script>
<script src="../js/app.js"></script>
<script src="../js/site.js"></script>
<script>
// Безопасный доступ к каталогу — products.js может не загрузиться (1.9 MB)
function findProductData(id) {
  if (typeof PRODUCTS_DATA !== 'undefined' && PRODUCTS_DATA.products) {
    return PRODUCTS_DATA.products.find(function(x){ return x.id === id; });
  }
  return null;
}

function renderCart() {
  var cart = Cart.get();
  var el = document.getElementById('cartContent');
  if (cart.length === 0) {
    el.innerHTML = '<div class="cart-empty"><div style="font-size:64px;margin-bottom:16px;">🛒</div><h2>Корзина пуста</h2><p>Добавьте товары из каталога</p><a href="../index.html" class="btn-primary" style="display:inline-flex;">Перейти в каталог</a></div>';
    return;
  }
  var total = Cart.total();
  var oldTotal = cart.reduce(function(s,i){
    var p = findProductData(i.id);
    return s+((p&&p.oldprice?p.oldprice:(p?p.price:i.price))*i.qty);
  },0);
  var savings = oldTotal - total;
  var totalQty = cart.reduce(function(s,i){return s+i.qty;},0);
  var summaryHtml = '<div class="cart-summary">';
  summaryHtml += '<h3>Итого</h3>';
  summaryHtml += '<div class="summary-row"><span>Товаров:</span><span>'+totalQty+' шт.</span></div>';
  if (savings>0) summaryHtml += '<div class="summary-row" style="color:#f02424;"><span>Экономия:</span><span>-'+formatPrice(savings)+'</span></div>';
  summaryHtml += '<div class="summary-row summary-total"><span>Сумма:</span><span>'+formatPrice(total)+'</span></div>';
  summaryHtml += '<a href="checkout.html" class="btn-checkout" onclick="try{ym(108563480,\'reachGoal\',\'order_form\')}catch(e){}">Оформить заказ</a>';
  summaryHtml += '</div>';
  el.innerHTML = '<div class="cart-layout"><div><div id="cartItems"></div><div style="margin-top:16px;"><button onclick="Cart.clear();renderCart();" style="font-family:var(--font);font-size:12px;color:#969696;cursor:pointer;border:none;background:none;text-decoration:underline;">Очистить корзину</button></div></div>'+summaryHtml+'</div>';
  document.getElementById('cartItems').innerHTML = cart.map(function(item){
    var p = findProductData(item.id);
    var pic = (p&&p.picture)?p.picture:(item.picture||'');
    return '<div class="cart-item">'+(pic?'<img class="cart-item-img" src="'+pic+'" alt="'+item.name+'" onerror="this.style.display=\'none\'">':'')+'<div><div class="cart-item-brand">'+item.brand+'</div><div class="cart-item-name"><a href="product.html?id='+item.id+'" style="color:inherit;">'+item.name+'</a></div><div style="margin-top:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(\''+item.id+'\',-1)">-</button><span class="qty-val">'+item.qty+'</span><button class="qty-btn" onclick="changeQty(\''+item.id+'\',1)">+</button></div><div class="cart-item-price">'+formatPrice(item.price*item.qty)+'</div><button class="cart-item-remove" onclick="removeItem(\''+item.id+'\')" title="Удалить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div></div></div>';
  }).join('');
}
function changeQty(id,delta){
  var cart=Cart.get();
  var idx=-1;
  for(var i=0;i<cart.length;i++){if(cart[i].id===id){idx=i;break;}}
  if(idx>=0){cart[idx].qty=Math.max(1,cart[idx].qty+delta);Cart.save(cart);renderCart();}
}
function removeItem(id){Cart.remove(id);renderCart();}
document.addEventListener('DOMContentLoaded',renderCart);
</script>
</body>
</html>
