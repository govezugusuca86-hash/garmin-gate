<main class="success-page container">

<!-- ===== SVG SPRITES ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="i-alert-tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </symbol>
    <symbol id="i-tg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.945 4.396a1 1 0 0 0-1.05-.27L2.62 10.93c-.73.27-.72 1.31.02 1.55l4.49 1.46 1.74 5.5c.22.7 1.1.92 1.62.41l2.55-2.46 4.62 3.42c.62.46 1.51.13 1.69-.62l3-13.55a1 1 0 0 0-.41-1.04zM9.84 14.18l-.42 3.45-1.27-4.01 9.5-6.07-7.81 6.63z"/>

    <symbol id="i-msg-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </symbol>
  </defs>
</svg>

<script src="../js/app.js"></script>
<script src="../js/site.js"></script>
<script>
(function () {
  'use strict';

  var TG_USER = 'neogar_shop';
  var MAX_URL_BASE = 'https://max.ru/u/f9LHodD0cOIZPc3t_P6gS2FugFx-px34uz96F0jFOJwjbQQmKSYSSKLSn98';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function svg(id, cls) {
    return '<svg class="' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }

  var data = null;
  try {
    var raw = sessionStorage.getItem('gg_last_order');
    if (raw) data = JSON.parse(raw);
  } catch (e) {}

  var box = document.getElementById('successBox');

  if (!data || !data.orderNumber) {
    // Прямой заход без заказа
    box.innerHTML =
      '<div class="success-check">' + svg('i-check') + '</div>' +
      '<h2>Заказ оформлен</h2>' +
      '<p class="intro">Здесь будет информация о вашем последнем заказе.</p>' +
      '<a href="../index.html" class="btn-primary" style="display:inline-flex;">Вернуться в каталог</a>';
    return;
  }

  // Сообщение для мессенджеров
  var lines = ['Здравствуйте! Оформил заказ ' + data.orderNumber + '.'];
  lines.push('Имя: ' + data.fullName);
  if (data.phone) lines.push('Телефон: ' + data.phone);
  if (data.email) lines.push('Email: ' + data.email);
  if (data.delivery && data.delivery.needed) {
    lines.push('Доставка: ' + (data.delivery.method || '—'));
    if (data.delivery.city) lines.push('Город: ' + data.delivery.city);
    if (data.delivery.address) lines.push('Адрес: ' + data.delivery.address);
  } else {
    lines.push('Самовывоз: ТЦ Талисман, Саранск');
  }
  if (data.comment) lines.push('Комментарий: ' + data.comment);
  lines.push('');
  lines.push('Состав:');
  data.items.forEach(function (it) {
    var label = (it.brand ? it.brand + ' ' : '') + it.name;
    lines.push('— ' + label + ' × ' + it.qty + ' = ' + (it.price * it.qty) + ' ₽');
  });
  lines.push('');
  lines.push('Итого: ' + data.total + ' ₽');
  var encoded = encodeURIComponent(lines.join('\n'));

  var detailsHtml = data.items.map(function (it) {
    var label = (it.brand ? it.brand + ' ' : '') + it.name + ' × ' + it.qty;
    return '<div class="order-details-row">' +
             '<span>' + escapeHtml(label) + '</span>' +
             '<span>' + formatPrice(it.price * it.qty) + '</span>' +
           '</div>';
  }).join('');

  var deliveryLine = '';
  if (data.delivery && data.delivery.needed) {
    var parts = [];
    if (data.delivery.method)  parts.push(data.delivery.method);
    if (data.delivery.city)    parts.push(data.delivery.city);
    if (data.delivery.address) parts.push(data.delivery.address);
    deliveryLine = '<div class="order-details-row"><span>Доставка:</span><span>' + escapeHtml(parts.join(', ')) + '</span></div>';
  } else {
    deliveryLine = '<div class="order-details-row"><span>Доставка:</span><span>Самовывоз, Саранск</span></div>';
  }

  box.innerHTML =
    '<div class="success-check">' + svg('i-check') + '</div>' +
    '<h2>' + (data.isPending ? 'Заказ принят' : 'Спасибо за заказ!') + '</h2>' +
    '<p class="intro">' +
      (data.isPending
        ? 'Заказ сохранён, но возникли проблемы с подтверждением. Напишите нам — мы всё уладим.'
        : 'Мы получили вашу заявку. Чтобы подтвердить заказ и договориться об оплате и доставке — напишите нам в любой удобный мессенджер. Сообщение с деталями уже готово, останется только нажать «Отправить».') +
    '</p>' +

    '<div class="order-number-pill">' +
      '<span class="label">Номер заказа</span>' +
      '<span class="value">' + escapeHtml(data.orderNumber) + '</span>' +
    '</div>' +

    (data.isPending
      ? '<div class="pending-notice">' +
          svg('i-alert-tri') +
          '<span>Не удалось связаться с сервером — заказ сохранён локально. ' +
                'Чтобы мы подтвердили его, напишите нам в Telegram или MAX (номер уже в сообщении).</span>' +
        '</div>'
      : '') +

    '<p class="success-contact-prompt">Обычно отвечаем в течение часа в рабочее время (10:00–20:00 МСК):</p>' +

    '<div class="contact-buttons">' +
      '<a class="btn-messenger btn-tg" target="_blank" rel="noopener" ' +
         'href="https://t.me/' + TG_USER + '?text=' + encoded + '">' +
        svg('i-tg') + 'Telegram' +
      '</a>' +
      '<a class="btn-messenger btn-max" target="_blank" rel="noopener" ' +
         'href="' + MAX_URL_BASE + '?text=' + encoded + '">' +
        svg('i-msg-square') + 'MAX' +
      '</a>' +
    '</div>' +

    '<details class="order-details">' +
      '<summary>Детали заказа</summary>' +
      '<div class="order-details-body">' +
        detailsHtml +
        deliveryLine +
        (data.comment ? '<div class="order-details-row"><span>Комментарий:</span><span>' + escapeHtml(data.comment) + '</span></div>' : '') +
        '<div class="order-details-total"><span>Итого:</span><span>' + formatPrice(data.total) + '</span></div>' +
      '</div>' +
    '</details>' +

    '<div><a href="../index.html" class="back-to-catalog">' + svg('i-arrow-left') + 'Вернуться в каталог</a></div>';

  try { if (window.ym) ym(108563480, 'reachGoal', 'order_success_view'); } catch (e) {}
})();
</script>
</body>
</html>
