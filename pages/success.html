<body data-page="success">
<div data-mount="header"></div>

<main class="success-page container">
  <div class="success-card" id="successBox"></div>
</main>

<div data-mount="footer"></div>

<!-- ===== SVG SPRITES ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="i-alert-tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </symbol>
    <symbol id="i-tg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.945 4.396a1 1 0 0 0-1.05-.27L2.62 10.93c-.73.27-.72 1.31.02 1.55l4.49 1.46 1.74 5.5c.22.7 1.1.92 1.62.41l2.55-2.46 4.62 3.42c.62.46 1.51.13 1.69-.62l3-13.55a1 1 0 0 0-.41-1.04zM9.84 14.18l-.42 3.45-1.27-4.01 9.5-6.07-7.81 6.63z"/>
    </symbol>
    <symbol id="i-msg-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
  </defs>
</svg>

<script src="../js/app.js"></script>
<script src="../js/site.js"></script>
<script>
(function () {
  'use strict';

  var TG_URL  = 'https://t.me/Egor_neogar';
  var MAX_URL = 'https://max.ru/u/f9LHodD0cOIZPc3t_P6gS2FugFx-px34uz96F0jFOJwjbQQmKSYSSKLSn98';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function svg(id, cls) {
    return '<svg class="' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }

  var data = null;
  try {
    var raw = sessionStorage.getItem('gg_last_order');
    if (raw) data = JSON.parse(raw);
  } catch (e) {}

  var box = document.getElementById('successBox');

  if (!data || !data.orderNumber) {
    // Прямой заход без заказа
    box.innerHTML =
      '<div class="success-check">' + svg('i-check') + '</div>' +
      '<h2>Заказ оформлен</h2>' +
      '<p class="intro">Здесь будет информация о вашем последнем заказе.</p>' +
      '<a href="../index.html" class="btn-primary" style="display:inline-flex;">Вернуться в каталог</a>';
    return;
  }

  // ===== Сообщение для мессенджеров: номер заказа подставляется в текст =====
  var lines = ['Здравствуйте! Оформил заказ ' + data.orderNumber + ' на сайте neogar.ru.'];
  if (data.fullName) lines.push('Имя: ' + data.fullName);
  if (data.contact)  lines.push('Контакт: ' + data.contact);
  if (data.email)    lines.push('Email: ' + data.email);
  if (data.delivery && data.delivery.needed) {
    lines.push('Нужна доставка (детали обсудим)');
  } else {
    lines.push('Самовывоз: ТЦ Талисман, Саранск');
  }
  if (data.comment) lines.push('Комментарий: ' + data.comment);
  lines.push('');
  lines.push('Состав заказа:');
  data.items.forEach(function (it) {
    var label = (it.brand ? it.brand + ' ' : '') + it.name;
    lines.push('— ' + label + ' × ' + it.qty + ' = ' + (it.price * it.qty) + ' ₽');
  });
  lines.push('');
  lines.push('Итого: ' + data.total + ' ₽');
  var encoded = encodeURIComponent(lines.join('\n'));

  // ===== Список товаров с ценами =====
  var totalQty = data.items.reduce(function (s, i) { return s + i.qty; }, 0);
  var detailsHtml = data.items.map(function (it) {
    var label = (it.brand ? it.brand + ' ' : '') + it.name + ' × ' + it.qty;
    return '<div class="order-details-row">' +
             '<span>' + escapeHtml(label) + '</span>' +
             '<span>' + formatPrice(it.price * it.qty) + '</span>' +
           '</div>';
  }).join('');

  box.innerHTML =
    '<div class="success-check">' + svg('i-check') + '</div>' +
    '<h2>Заказ оформлен</h2>' +
    '<p class="intro success-intro-strong">' +
      '<strong>Напишите нам номер заказа в Telegram или MAX, чтобы мы начали сборку.</strong> ' +
      'Сами мы не звоним — заказ подтверждается только после вашего сообщения.' +
    '</p>' +

    // Большой блок с номером заказа + кнопка копирования
    '<div class="order-number-block">' +
      '<div class="order-number-pill">' +
        '<span class="label">Номер заказа</span>' +
        '<span class="value" id="orderNumberValue">' + escapeHtml(data.orderNumber) + '</span>' +
      '</div>' +
      '<button type="button" class="btn-copy-number" id="btnCopyNumber" title="Скопировать номер">' +
        svg('i-copy') + '<span>Скопировать</span>' +
      '</button>' +
    '</div>' +

    (data.isPending
      ? '<div class="pending-notice">' +
          svg('i-alert-tri') +
          '<span>Не удалось связаться с сервером — заказ сохранён локально. ' +
                'Обязательно напишите нам в Telegram или MAX (номер заказа уже в готовом сообщении), чтобы мы подтвердили его.</span>' +
        '</div>'
      : '') +

    // Две кнопки мессенджеров — текст сообщения уже подставлен
    '<div class="contact-buttons">' +
      '<a class="btn-messenger btn-tg" target="_blank" rel="noopener" ' +
         'href="' + TG_URL + '?text=' + encoded + '" ' +
         'onclick="try{ym(108563480,\'reachGoal\',\'contact_tg\')}catch(e){}">' +
        svg('i-tg') + 'Написать в Telegram' +
      '</a>' +
      '<a class="btn-messenger btn-max" target="_blank" rel="noopener" ' +
         'href="' + MAX_URL + '?text=' + encoded + '" ' +
         'onclick="try{ym(108563480,\'reachGoal\',\'contact_max\')}catch(e){}">' +
        svg('i-msg-square') + 'Написать в MAX' +
      '</a>' +
    '</div>' +

    // Список товаров с ценами и итогом — всегда видимый, не в details
    '<div class="order-summary-card">' +
      '<h3>Ваш заказ</h3>' +
      '<div class="order-details-body">' +
        detailsHtml +
        '<div class="order-details-row order-details-meta"><span>Товаров:</span><span>' + totalQty + ' шт.</span></div>' +
        (data.delivery && data.delivery.needed
          ? '<div class="order-details-row order-details-meta"><span>Доставка:</span><span>Согласуем в мессенджере</span></div>'
          : '<div class="order-details-row order-details-meta"><span>Доставка:</span><span>Самовывоз, Саранск</span></div>') +
        (data.comment ? '<div class="order-details-row order-details-meta"><span>Комментарий:</span><span>' + escapeHtml(data.comment) + '</span></div>' : '') +
        '<div class="order-details-total"><span>Итого:</span><span>' + formatPrice(data.total) + '</span></div>' +
      '</div>' +
    '</div>' +

    '<div><a href="../index.html" class="back-to-catalog">' + svg('i-arrow-left') + 'Вернуться в каталог</a></div>';

  // Кнопка копирования номера
  var copyBtn = document.getElementById('btnCopyNumber');
  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      var num = data.orderNumber;
      var ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(num);
          ok = true;
        }
      } catch (e) {}
      if (!ok) {
        // fallback
        try {
          var ta = document.createElement('textarea');
          ta.value = num; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy');
          document.body.removeChild(ta); ok = true;
        } catch (e) {}
      }
      var labelSpan = copyBtn.querySelector('span');
      if (labelSpan) {
        var prev = labelSpan.textContent;
        labelSpan.textContent = ok ? 'Скопировано ✓' : 'Не удалось';
        copyBtn.classList.add('is-copied');
        setTimeout(function () {
          labelSpan.textContent = prev;
          copyBtn.classList.remove('is-copied');
        }, 1800);
      }
    });
  }

  try { if (window.ym) ym(108563480, 'reachGoal', 'order_success_view'); } catch (e) {}
})();
</script>
</body>
</html>
